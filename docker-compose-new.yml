version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8084:8080"   
    networks:
      - app-net

  frontend:
    image: nginx:alpine
    ports:
      - "8082:80"     
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx-custom.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
